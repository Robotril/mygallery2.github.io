<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLAYFRONT trailer</title>
<meta name="description" content="Watch the CLAYFRONT trailer: a free clay shooter you play in your browser.">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<style>
@font-face { font-family: "Baloo 2"; font-weight: 800; src: url(../fonts/baloo-2-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: Nunito; font-weight: 800; src: url(../fonts/nunito-latin-800-normal.woff2) format("woff2"); }
:root { --ink: #1d2242; --sky: #5aaeff; --sky-d: #3487de; --logo: #1f5fa6; --sun: #ffd23f; --tangerine: #ff8a3d; --tangerine-d: #e0661b; --white: #f4f7fc; --white-d: #d9e1ef; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 30%, #8cc8ff 0%, var(--sky) 45%, var(--sky-d) 100%); color: var(--ink); font-family: Nunito, system-ui, sans-serif; font-weight: 800; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px; gap: 22px; }
.logo { font-family: "Baloo 2", Nunito, sans-serif; font-size: clamp(40px, 8vw, 72px); line-height: .9; color: var(--white); background: var(--logo); padding: 10px 28px 16px; border-radius: 28px 34px 30px 26px / 30px 26px 32px 28px; box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -8px 0 #163f70, 0 14px 26px -10px rgba(29,34,66,.5); }
.logo span { color: var(--sun); }
.frame { width: min(1100px, 100%); border-radius: 26px; overflow: hidden; background: var(--white); padding: 10px; box-shadow: inset 0 3px 0 rgba(255,255,255,.6), inset 0 -8px 0 var(--white-d), 0 18px 34px -12px rgba(29,34,66,.5); }
video { display: block; width: 100%; height: auto; border-radius: 18px; background: #000; }
.row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
a.btn { text-decoration: none; color: var(--ink); background: var(--white); padding: 14px 26px; border-radius: 999px; font-size: 18px; box-shadow: inset 0 3px 0 rgba(255,255,255,.6), inset 0 -5px 0 var(--white-d), 0 10px 18px -8px rgba(29,34,66,.4); }
a.btn.play { background: var(--tangerine); box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -5px 0 var(--tangerine-d), 0 10px 18px -8px rgba(29,34,66,.4); font-size: 22px; }
a.btn:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
p { margin: 0; max-width: 640px; text-align: center; font-size: 16px; color: var(--white); text-shadow: 0 1px 2px rgba(29,34,66,.4); }
</style>
</head>
<body>
  <div class="logo">CLAY<span>FRONT</span></div>
  <div class="frame"><video src="clayfront-trailer.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video></div>
  <div class="row">
    <a class="btn play" href="../">Play CLAYFRONT</a>
    <a class="btn" href="clayfront-trailer.mp4" download>Download trailer</a>
    <a class="btn" href="clayfront-trailer-nobgm.mp4" download>Download without music</a>
  </div>
  <p>All gameplay in this trailer is captured from the real game, played against bots.</p>
</body>
</html>
